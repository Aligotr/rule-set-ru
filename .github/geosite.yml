lists:
  ru-whitelist:
    - vk
    - yandex

  ru-direct:
    - ru-whitelist
    - category-gov-ru
    - x5
    - bitwarden

  ru-blocked:
    - ext-antifilter
    - ext-refilter
    - youtube
    - discord
    - instagram
    - telegram
    - jetbrains

  category-ads-all:
    - ext-winspy
    - ext-adguard

publish:
  ru-whitelist: geosite_whitelist
  ru-direct: geosite_direct
  ru-blocked: geosite_proxy
  category-ads-all: geosite_block

externals:
  ext-winspy:
    url: https://raw.githubusercontent.com/crazy-max/WindowsSpyBlocker/master/data/hosts/spy.txt
    format: hosts_0.0.0.0

  ext-adguard:
    url: https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt
    format: adguard_filter

  ext-antifilter:
    url: https://community.antifilter.download/list/domains.lst
    format: plain

  ext-refilter:
    url: https://raw.githubusercontent.com/1andrevich/Re-filter-lists/main/domains_all.lst
    format: plain

local_routing:
  direct: ru-direct
  white: ru-direct
  proxy: ru-blocked
  block: ru-blocked
  black: ru-blocked
  ads: category-ads-all
  spy: category-ads-all
