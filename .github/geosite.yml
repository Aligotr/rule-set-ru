roots:
  - ru-whitelist
  - ru-direct
  - ru-blocked
  - category-ads-all

publish:
  dat:
    - ru-whitelist
    - ru-direct
    - ru-blocked
    - category-ads-all
    - youtube
    - telegram

  text:
    ru-whitelist: geosite_whitelist
    ru-direct: geosite_direct
    ru-blocked: geosite_proxy
    category-ads-all: geosite_block
    youtube: geosite_youtube
    telegram: geosite_telegram

lists:
  ru-whitelist:
    - vk
    - yandex

  ru-direct:
    - ru-whitelist
    - category-gov-ru
    - x5
    - bitwarden
    - gosuslugi

  ru-blocked:
    - ext-antifilter
    - ext-refilter
    - youtube
    - telegram
    - discord
    - instagram
    - jetbrains

  category-ads-all:
    - ext-winspy
    - ext-adguard

externals:
  ext-winspy:
    url: https://raw.githubusercontent.com/crazy-max/WindowsSpyBlocker/master/data/hosts/spy.txt
    format: hosts_0.0.0.0

  ext-adguard:
    url: https://adguardteam.github.io/AdGuardSDNSFilter/Filters/filter.txt
    format: adguard_filter

  ext-antifilter:
    url: https://community.antifilter.download/list/domains.lst
    format: plain

  ext-refilter:
    url: https://raw.githubusercontent.com/1andrevich/Re-filter-lists/main/domains_all.lst
    format: plain

local_routing:
  direct:
    target: ru-direct
  white:
    target: ru-direct
  proxy:
    target: ru-blocked
  block:
    target: ru-blocked
  black:
    target: ru-blocked
  ads:
    target: category-ads-all
  spy:
    target: category-ads-all
