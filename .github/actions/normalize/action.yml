name: Normalize Files Action
description: Удаление мусора из строк и опциональная дедупликация

inputs:
  input_path:
    description: Путь к папке или одиночному файлу
    required: true
  output_path:
    description: Путь к директории для сохранения результата
    required: true
  prefix:
    description: Префикс конечного файла
    required: false
    default: ""
  ext:
    description: Расширение конечного файла
    required: false
    default: ""
  dedupe:
    description: Удаление дублирующихся строк с сохранением порядка
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        process_file() {
          local file="$1"
          local out_path="${{ inputs.output_path }}"
          local raw_prefix="${{ inputs.prefix }}"
          local prefix="${raw_prefix:+"${raw_prefix}_"}"
          local raw_ext="${{ inputs.ext }}"
          local dedupe="${{ inputs.dedupe }}"

          filename=$(basename "$file")
          if [ -n "$raw_ext" ]; then
            name="${filename%.*}"
            filename="${name}.${raw_ext}"
          fi

          [ -e "$file" ] || return 0

          mkdir -p "$out_path"

          if [ "$dedupe" = "true" ]; then
            awk '
              {
                gsub(/\r/, "", $0)
                sub(/[[:space:]]*#.*$/, "", $0)
                sub(/^[[:space:]{}"'"'"']+/, "", $0)
                sub(/[[:space:]{}"'"'"']+$/, "", $0)
              }
              /^[[:space:]]*include:/ { next }
              /^$/ { next }
              !seen[$0]++ { print }
            ' "$file" > "${out_path}/${prefix}${filename}"
          else
            sed "
              s/\r//g;                  # Удаление Windows CR
              s/#.*//;                  # Удаление всего после символа #
              s/^[[:space:]{}\"']*//;   # Удаление пробелов и кавычек в начале
              s/[[:space:]{}\"']*$//;   # Удаление пробелов и кавычек в конце
              /^[[:space:]]*include:/d; # Удаление строк include:
              /^$/d                     # Удаление пустых строк
            " "$file" > "${out_path}/${prefix}${filename}"
          fi
        }

        if [ -d "${{ inputs.input_path }}" ]; then
          # Обработка директории
          for f in "${{ inputs.input_path }}"/*; do
            [ -f "$f" ] && process_file "$f"
          done
        elif [ -f "${{ inputs.input_path }}" ]; then
          # Обработка одиночного файла
          process_file "${{ inputs.input_path }}"
        else
          echo "Warning: Path ${{ inputs.input_path }} not found."
        fi
