name: Generate Sing-box Ruleset
description: Парсинг и компиляция списков в бинарный формат Sing-box (.srs)

inputs:
  input_path:
    description: Директория или путь к исходному файлу
    required: true
  output_path:
    description: Директория для сохранения результатов обработки
    required: true

runs:
  using: composite
  steps:
    - name: Bootstrap Sing-box Compiler
      shell: bash
      run: |
        # Проверка наличия компилятора в системе
        if ! command -v sing-box &> /dev/null; then
          echo "=> [SRS] Скачивание компилятора Sing-box..."
          BIN_DIR="${RUNNER_TEMP}/rule_compilers"
          mkdir -p "$BIN_DIR"
          
          SB_URL=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | jq -r '.assets[] | select(.name | contains("linux-amd64.tar.gz")) | .browser_download_url')
          # Извлечение только бинарного файла из архива
          curl -sL "$SB_URL" | tar -xz --strip-components=1 -C "$BIN_DIR" --wildcards "*/sing-box"
          
          echo "$BIN_DIR" >> $GITHUB_PATH
          echo "=> [SRS] Установка Sing-box завершена"
        else
          echo "=> [SRS] Использование существующего компилятора Sing-box"
        fi

    - name: Compile SRS
      shell: bash
      run: |
        process_file() {
          local file="$1"
          local name="$(basename "$file" .txt)"
          
          [ -s "$file" ] || return 0

          # Формирование JSON структуры
          jq -Rn '
          # Распределение правил по массивам JSON-объекта
          reduce inputs as $line (
            { sfx:[], dom:[], kwd:[], rgx:[] };
            
            if ($line | length == 0) then .
            elif ($line | startswith("full:")) then .dom += [$line[5:]]
            elif ($line | startswith("keyword:")) then .kwd += [$line[8:]]
            elif ($line | startswith("regexp:")) then .rgx += [$line[7:]]
            elif ($line | startswith("domain:")) then .sfx += [$line[7:]]
            else .sfx += [$line]
            end
          ) | 
          {
            "version": 1,
            "rules": [
              {
                "domain_suffix":  (if (.sfx | length) > 0 then .sfx else null end),
                "domain":         (if (.dom | length) > 0 then .dom else null end),
                "domain_keyword": (if (.kwd | length) > 0 then .kwd else null end),
                "domain_regex":   (if (.rgx | length) > 0 then .rgx else null end)
              } | with_entries(select(.value != null))
            ]
          }
          ' "$file" > tmp_singbox.json
          
          # Компиляция целевого бинарного файла
          sing-box rule-set compile tmp_singbox.json --output "${{ inputs.output_path }}/${name}.srs"
          rm -f tmp_singbox.json
          
          echo "=> [SRS] Завершено форматирование (${name}.srs)"
        }

        mkdir -p "${{ inputs.output_path }}"

        if [ -d "${{ inputs.input_path }}" ]; then
          for f in "${{ inputs.input_path }}"/*.txt; do [ -f "$f" ] && process_file "$f"; done
        elif [ -f "${{ inputs.input_path }}" ]; then
          process_file "${{ inputs.input_path }}"
        fi
