name: Generate Mihomo Ruleset
description: Компиляция правил маршрутизации в бинарный формат Mihomo (.mrs)

inputs:
  input_path:
    description: Директория или путь к исходному файлу
    required: true
  output_path:
    description: Директория для сохранения результатов обработки
    required: true

runs:
  using: composite
  steps:
    - name: Bootstrap Mihomo Compiler
      shell: bash
      run: |
        # Проверка наличия компилятора в системе
        if ! command -v mihomo &> /dev/null; then
          echo "=> [MRS] Скачивание компилятора Mihomo..."
          BIN_DIR="${RUNNER_TEMP}/rule_compilers"
          mkdir -p "$BIN_DIR"
          
          MIHOMO_URL=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r '.assets[] | select(.name | contains("linux-amd64") and endswith(".gz")) | .browser_download_url' | head -n 1)
          curl -sL "$MIHOMO_URL" | gunzip > "$BIN_DIR/mihomo"
          chmod +x "$BIN_DIR/mihomo"
          
          echo "$BIN_DIR" >> $GITHUB_PATH
          echo "=> [MRS] Установка Mihomo завершена"
        else
          echo "=> [MRS] Использование существующего компилятора Mihomo"
        fi

    - name: Compile MRS
      shell: bash
      run: |
        process_file() {
          local file="$1"
          local name="$(basename "$file" .txt)"
          
          [ -s "$file" ] || return 0

          echo "payload:" > tmp_payload.yaml
          awk '
            /^full:/    { print "  - \x27" substr($0,6) "\x27"; next }
            /^keyword:/ { print "  - DOMAIN-KEYWORD," substr($0,9); next }
            /^regexp:/  { next } 
            /^domain:/  { print "  - \x27+." substr($0,8) "\x27"; next }
            { print "  - \x27+." $0 "\x27" }
          ' "$file" >> tmp_payload.yaml
          
          # Компиляция целевого бинарного файла
          mihomo convert-ruleset domain yaml tmp_payload.yaml "${{ inputs.output_path }}/${name}.mrs"
          rm -f tmp_payload.yaml
          
          echo "=> [MRS] Завершено форматирование (${name}.mrs)"
        }

        mkdir -p "${{ inputs.output_path }}"

        if [ -d "${{ inputs.input_path }}" ]; then
          for f in "${{ inputs.input_path }}"/*.txt; do [ -f "$f" ] && process_file "$f"; done
        elif [ -f "${{ inputs.input_path }}" ]; then
          process_file "${{ inputs.input_path }}"
        fi
