name: Generate Plain Text List
description: Конвертация распакованного списка V2Ray в чистый текстовый формат (.txt)

inputs:
  input_path:
    description: Директория или путь к исходному файлу
    required: true
  output_path:
    description: Директория для сохранения результатов обработки
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        process_file() {
          local file="$1"
          local name="$(basename "$file" .txt)"
          
          # Исключение пустых файлов из процесса
          [ -s "$file" ] || return 0

          # Удаление технических префиксов (оставление исключительно доменов и правил)
          sed -E 's/^(full|keyword|regexp)://' "$file" > "${{ inputs.output_path }}/${name}.txt"
          
          echo "=> [Plain text] Завершено форматирование (${name}.txt)"
        }

         # Создание выходной директории
        mkdir -p "${{ inputs.output_path }}"
        
        # Маршрутизация обработки (директория или одиночный файл)
        if [ -d "${{ inputs.input_path }}" ]; then
          for f in "${{ inputs.input_path }}"/*.txt; do [ -f "$f" ] && process_file "$f"; done
        elif [ -f "${{ inputs.input_path }}" ]; then
          process_file "${{ inputs.input_path }}"
        fi
