name: Unpack V2Ray Dat File
description: Декомпиляция бинарного файла V2Ray (.dat) в набор чистых текстовых списков

inputs:
  input_file:
    description: Путь к исходному файлу .dat (например, geosite.dat)
    required: true
  output_path:
    description: Директория для сохранения распакованных текстовых файлов
    required: true
  type:
    description: Тип данных (geosite или geoip)
    required: false
    default: "geosite"

runs:
  using: composite
  steps:
    - name: Bootstrap v2dat Utility
      shell: bash
      run: |
        # Проверка наличия утилиты в системном окружении
        if ! command -v v2dat &> /dev/null; then
          echo "=> [v2dat] Установка утилиты v2dat..."
          
          # Установка утилиты через встроенный Go-инструментарий
          go install github.com/uraimo/v2dat@latest
          
          # Регистрация пути локальных Go-бинарников для текущего шага и последующих
          export PATH="$(go env GOPATH)/bin:$PATH"
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          
          echo "=> [v2dat] Установка v2dat завершена"
        else
          echo "=> [v2dat] Использование существующей утилиты v2dat"
        fi

    - name: Process Unpack
      shell: bash
      run: |        
        mkdir -p "${{ inputs.output_path }}"
        
        # Выполнение декомпиляции с извлечением в формате чистого текста
        v2dat unpack "${{ inputs.type }}" -o "${{ inputs.output_path }}" "${{ inputs.input_file }}"
        
        echo "=> [v2dat] Завершена декомпиляции в директорию ${{ inputs.output_path }}"
