name: Build GeoIP
on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CURL: "curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused"
      OUTPUT_PATH: output

    steps:
      # Install dependencies
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Loyalsoldier/geoip
        uses: actions/checkout@v4
        with:
          repository: Loyalsoldier/geoip
          path: geoip

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: geoip/go.mod
          cache-dependency-path: geoip/go.sum

      # Build
      - name: Build GeoIP
        run: |
          # Загрузка данных
          ${{ env.CURL }} --output-dir ./geolite2 -O https://raw.githubusercontent.com/Loyalsoldier/geoip/release/GeoLite2-ASN-Blocks-IPv4.csv
          
          # Сборка
          go build -C geoip .
          geoip/geoip convert -c geoip_v2ray_config.json

          # Перемещение результатов
          ls -lR ./output
          # srs
          # mv output/srs/ru-blocked.srs output/geoip_proxy.srs
          for f in output/srs/*; do mv "$f" "output/geoip_$(basename "$f")"; done
          # mrs
          # mv output/mrs/ru-blocked.mrs output/geoip_proxy.mrs
          for f in output/mrs/*; do mv "$f" "output/geoip_$(basename "$f")"; done
          # lst
          # mv output/text/ru-blocked.lst output/geoip_proxy.lst
          for f in output/text/*.lst; do mv "$f" "output/geoip_$(basename "$f")"; done
          # txt
          for f in output/text/*; do mv "$f" "output/text/geoip_$(basename "$f")"; done
          rm -rf output/{mrs,srs}

      # Uploading results
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: geoip-output
          path: output
