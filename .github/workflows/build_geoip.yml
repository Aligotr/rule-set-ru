name: Build GeoIP
on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GEOIP_PATH: geoip
      OUTPUT_PATH: output
      GEOLITE2_PATH: geolite2

    steps:
      - name: Checkout User Codebase
        uses: actions/checkout@v4

      - name: Checkout Loyalsoldier/geoip
        uses: actions/checkout@v4
        with:
          repository: Loyalsoldier/geoip
          path: ${{ env.GEOIP_PATH }}

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.GEOIP_PATH }}/go.mod
          cache-dependency-path: ${{ env.GEOIP_PATH }}/go.sum

      - name: Initialize Workspace
        run: |
          set -euo pipefail

          mkdir -p \
            "${{ env.GEOIP_PATH }}" \
            "${{ env.OUTPUT_PATH }}" \
            "${{ env.GEOLITE2_PATH }}"

      - name: Download GeoLite2 ASN Data
        run: |
          set -euo pipefail

          curl -fsSL \
            "https://raw.githubusercontent.com/Loyalsoldier/geoip/release/GeoLite2-ASN-Blocks-IPv4.csv" \
            -o "${{ env.GEOLITE2_PATH }}/GeoLite2-ASN-Blocks-IPv4.csv"

          echo "=> [GeoIP - Download] GeoLite2-ASN-Blocks-IPv4.csv загружен"

      - name: Build GeoIP
        run: |
          set -euo pipefail

          # Сборка бинарного инструмента
          go build -C "${{ env.GEOIP_PATH }}" .

          # Выполнение сборки по конфигурации
          "${{ env.GEOIP_PATH }}/geoip" convert -c geoip_v2ray_config.json

          echo "=> [GeoIP - Build] Сборка GeoIP завершена"

      - name: Show Final Diagnostics
        run: |
          set -euo pipefail

          echo "=> [GeoIP - Diagnostics] Финальное содержимое output"
          find "${{ env.OUTPUT_PATH }}" -maxdepth 1 -type f | sort

          echo "=> [GeoIP - Diagnostics] Финальный размер output:"
          du -sh "${{ env.OUTPUT_PATH }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: geoip-output
          path: output/
