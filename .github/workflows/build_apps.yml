name: Build AppsList
on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CONFIG_PATH: .github/apps.yml
      RAW_PATH: apps-raw
      STAGING_PATH: staging
      OUTPUT_PREFIX: apps
      OUTPUT_PATH: output
      OUTPUT_TEXT_PATH: output/text

    steps:
      - name: Checkout User Codebase
        uses: actions/checkout@v4

      # Инициализация базовой среды
      - name: Setup YQ Environment
        run: |
          # Установка YAML-парсера для чтения конфигурации сборки
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Initialize Workspace
        run: |
          # Выделение базовых директорий для рабочего процесса
          mkdir -p \
            "${{ env.RAW_PATH }}" \
            "${{ env.STAGING_PATH }}" \
            "${{ env.OUTPUT_PATH }}" \
            "${{ env.OUTPUT_TEXT_PATH }}"

      # Подготовка правил
      - name: Prepare source rule-lists
        run: |
          set -euo pipefail

          # Копирование исходных JSON-файлов в архив исходников
          for f in apps/*.json; do
            [ -e "$f" ] || continue
            cp "$f" "${{ env.OUTPUT_TEXT_PATH }}/${{ env.OUTPUT_PREFIX }}_$(basename "$f")"
            echo "=> [Apps - Sources] Файл '$(basename "$f")' добавлен в архив исходников"
          done

      - name: Create custom-lists from LOCAL rule-lists
        run: |
          set -euo pipefail

          # Формирование merged-списков по конфигурации
          while read -r list_name; do
            [ -n "$list_name" ] || continue

            tmp_list="${{ env.RAW_PATH }}/.${list_name}.list"
            : > "$tmp_list"

            while read -r item; do
              [ -n "$item" ] || continue

              if [ -f "apps/${item}.json" ]; then
                printf '%s\n' "apps/${item}.json" >> "$tmp_list"
                echo "=> [Apps - Rules] Файл '${item}.json' добавлен в список <$list_name>"
              else
                echo "=> Warning [Apps - Rules] Локальный файл '${item}.json' не найден"
              fi
            done < <(yq -r ".lists_local.\"$list_name\"[]" "${{ env.CONFIG_PATH }}")

            if [ -s "$tmp_list" ]; then
              jq -s '
                {
                  version: (.[0].version // 1),
                  rules: [ .[] | .rules[]? ]
                }
              ' $(sed '/^$/d' "$tmp_list") > "${{ env.STAGING_PATH }}/${list_name}.json"

              echo "=> [Apps - Rules] Список '$list_name' успешно сформирован"
            else
              echo "=> Warning [Apps - Rules] Список '$list_name' пуст, формирование пропущено"
            fi

            rm -f "$tmp_list"
          done < <(yq -r '.publish | keys[]' "${{ env.CONFIG_PATH }}")

      - name: Prepare Staging Subsystem
        run: |
          set -euo pipefail

          make_public_name() {
            local name="$1"
            printf '%s_%s\n' "${{ env.OUTPUT_PREFIX }}" "$name"
          }

          # Копирование целевых JSON-файлов с применением финальных публичных имен конфигурации
          while IFS='=' read -r src_tag public_name; do
            src_file="${{ env.STAGING_PATH }}/${src_tag}.json"
            [ -f "$src_file" ] || continue

            output_name=$(make_public_name "$public_name")

            cp "$src_file" "${{ env.STAGING_PATH }}/${output_name}.json"
            rm -f "$src_file"

            echo "=> [Apps - Staging] Файл '$src_tag.json' подготовлен как '${output_name}.json'"
          done < <(yq -r '.publish | to_entries[] | "\(.key)=\(.value)"' "${{ env.CONFIG_PATH }}")

      # Сборка
      - name: Build Mihomo App Rule-sets (.yaml, .mrs)
        uses: ./.github/actions/apps/mrs
        with:
          input_path: ${{ env.STAGING_PATH }}
          output_path: ${{ env.OUTPUT_PATH }}

      - name: Build Sing-box App Rule-sets (.srs)
        uses: ./.github/actions/apps/srs
        with:
          input_path: ${{ env.STAGING_PATH }}
          output_path: ${{ env.OUTPUT_PATH }}

      - name: Show Final Diagnostics
        run: |
          set -euo pipefail

          echo "=> [Apps - Diagnostics] Финальное содержимое output"
          find "${{ env.OUTPUT_PATH }}" -maxdepth 1 -type f | sort

          echo "=> [Apps - Diagnostics] Финальный размер output:"
          du -sh "${{ env.OUTPUT_PATH }}"

      # Загрузка результатов
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apps-output
          path: output/
