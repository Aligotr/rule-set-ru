name: Build AppsList
on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CONFIG_PATH: .github/apps.yml
      STAGING_PATH: staging
      OUTPUT_PREFIX: apps
      OUTPUT_PATH: output

    steps:
      - name: Checkout User Codebase
        uses: actions/checkout@v4

      # Инициализация базовой среды
      - name: Setup YQ Environment
        run: |
          # Установка YAML-парсера для чтения конфигурации сборки
          YQ_VERSION="v4.44.3"
          sudo wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq

      - name: Initialize Workspace
        run: |
          # Выделение базовых директорий для рабочего процесса
          mkdir -p \
            "${{ env.STAGING_PATH }}" \
            "${{ env.OUTPUT_PATH }}"

      # Подготовка правил
      - name: Build and stage merged rule-lists
        run: |
          set -euo pipefail
 
          while IFS='=' read -r list_tag public_name; do
            [ -n "$list_tag" ] || continue
 
            output_name="${{ env.OUTPUT_PREFIX }}_${public_name}"
            sources=()
 
            while read -r item; do
              [ -n "$item" ] || continue
              f="apps/${item}.json"
              if [ -f "$f" ]; then
                sources+=("$f")
                echo "=> [Merge:${list_tag}] + ${item}.json"
              else
                echo "=> Warning [Merge:${list_tag}] not found: ${item}.json"
              fi
            done < <(yq -r ".lists_local.\"${list_tag}\"[]" "${{ env.CONFIG_PATH }}")
 
            if [ "${#sources[@]}" -eq 0 ]; then
              echo "=> Warning [Merge:${list_tag}] no sources, skipping"
              continue
            fi
 
            jq -s '{
              version: (.[0].version // 1),
              rules: [ .[] | .rules[]? ]
            }' "${sources[@]}" > "${{ env.STAGING_PATH }}/${output_name}.json"
 
            echo "=> [Staging] ready: ${output_name}.json"
          done < <(yq -r '.publish | to_entries[] | "\(.key)=\(.value)"' "${{ env.CONFIG_PATH }}")

      # Сборка
      - name: Build Apps Mihomo YAML Rule-sets (.yaml)
        uses: ./.github/actions/apps/mihomo_yaml
        with:
          input_path: ${{ env.STAGING_PATH }}
          output_path: ${{ env.OUTPUT_PATH }}

      # - name: Build Sing-box App Rule-sets (.srs)
      #   uses: ./.github/actions/apps/srs
      #   with:
      #     input_path: ${{ env.STAGING_PATH }}
      #     output_path: ${{ env.OUTPUT_PATH }}

      - name: Show Final Diagnostics
        run: |
          set -euo pipefail

          echo "=> [Apps - Diagnostics] Финальное содержимое output"
          find "${{ env.OUTPUT_PATH }}" -maxdepth 1 -type f | sort

          echo "=> [Apps - Diagnostics] Финальный размер output:"
          du -sh "${{ env.OUTPUT_PATH }}"

      # Загрузка результатов
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apps-output
          path: output/
