name: Build AppsList
on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CONFIG_PATH: .github/apps.yml
      RAW_PATH: apps-raw
      STAGING_PATH: staging
      OUTPUT_PATH: output
      OUTPUT_TEXT_PATH: output/text

    steps:
      - name: Checkout User Codebase
        uses: actions/checkout@v4

      # Инициализация базовой среды
      - name: Setup YQ Environment
        run: |
          # Установка YAML-парсера для чтения конфигурации сборки
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Initialize Workspace
        run: |
          # Выделение базовых директорий для рабочего процесса
          mkdir -p \
            "${{ env.RAW_PATH }}" \
            "${{ env.STAGING_PATH }}" \
            "${{ env.OUTPUT_PATH }}" \
            "${{ env.OUTPUT_TEXT_PATH }}"

      # Подготовка правил
      - name: Prepare source rule-lists
        run: |
          set -euo pipefail

          # Копирование исходных JSON-файлов в архив исходников
          for f in apps/*.json; do
            [ -e "$f" ] || continue
            cp "$f" "${{ env.OUTPUT_TEXT_PATH }}/apps_$(basename "$f")"
            echo "=> [Apps - Sources] Файл '$(basename "$f")' добавлен в архив исходников"
          done

      - name: Create custom-lists from LOCAL rule-lists
        run: |
          set -euo pipefail

          declare -A ROUTE_MAP=()

          while read -r key; do
            ROUTE_MAP["$key"]="$(yq -r ".routing.\"$key\"" "${{ env.CONFIG_PATH }}")"
          done < <(yq -r '.routing | keys[]' "${{ env.CONFIG_PATH }}")

          # Извлечение всех ключей словаря для логирования
          # Замена пробелов на запятые для читабельного вывода
          ALL_KEYS=$(printf "%s\n" "${!ROUTE_MAP[@]}" | paste -sd ", " -)

          declare -A GROUP_FILES=()

          for file in apps/*.json; do
            # Пропуск шага в случае отсутствия JSON-файлов
            [ -e "$file" ] || continue

            # Извлечение базового имени файла
            fname=$(basename "$file" .json)

            matched=false

            # Эвристическое распределение (Назначение маршрута на основе ключевых слов в имени)
            # Итерация по всем ключам словаря для поиска совпадений в имени файла
            for key in "${!ROUTE_MAP[@]}"; do
              if [[ "$fname" == *"$key"* ]]; then
                # Извлечение целевой группы из словаря
                dest="${ROUTE_MAP[$key]}"

                GROUP_FILES["$dest"]+="$file"$'\n'
                echo "=> [Apps - Rules] Файл '$fname' содержит ключ '$key', добавлен в список <$dest>"

                matched=true
                break # Остановка поиска при первом найденном совпадении
              fi
            done

            # Обработка файлов без совпадений
            if [ "$matched" = false ]; then
              echo "=> Warning [Apps - Rules] Локальный файл $fname пропущен, в названии отсутствуют допустимые ключи маршрутизации: $ALL_KEYS"
            fi
          done

          # Формирование merged-списков по целевым группам
          for group in "${!GROUP_FILES[@]}"; do
            tmp_list="${{ env.RAW_PATH }}/.${group}.list"
            printf "%s" "${GROUP_FILES[$group]}" > "$tmp_list"

            jq -s '
              {
                version: (.[0].version // 1),
                rules: [ .[] | .rules[]? ]
              }
            ' $(sed '/^$/d' "$tmp_list") > "${{ env.STAGING_PATH }}/${group}.json"

            rm -f "$tmp_list"
            echo "=> [Apps - Rules] Список '$group' успешно сформирован"
          done

      - name: Prepare Staging Subsystem
        run: |
          set -euo pipefail

          # Копирование целевых JSON-файлов с применением финальных публичных имен конфигурации
          while IFS='=' read -r src_tag public_name; do
            src_file="${{ env.STAGING_PATH }}/${src_tag}.json"
            [ -f "$src_file" ] || continue

            cp "$src_file" "${{ env.STAGING_PATH }}/${public_name}.json"
            rm -f "$src_file"

            echo "=> [Apps - Staging] Файл '$src_tag.json' подготовлен как '${public_name}.json'"
          done < <(yq -r '.publish | to_entries[] | "\(.key)=\(.value)"' "${{ env.CONFIG_PATH }}")

      # Сборка
      - name: Build Mihomo App Rule-sets (.yaml, .mrs)
        uses: ./.github/actions/converters/apps-mrs
        with:
          input_path: ${{ env.STAGING_PATH }}
          output_path: ${{ env.OUTPUT_PATH }}

      - name: Build Sing-box App Rule-sets (.srs)
        uses: ./.github/actions/converters/apps-srs
        with:
          input_path: ${{ env.STAGING_PATH }}
          output_path: ${{ env.OUTPUT_PATH }}

      - name: Show Final Diagnostics
        run: |
          set -euo pipefail

          echo "=> [Apps - Diagnostics] Финальное содержимое output"
          find "${{ env.OUTPUT_PATH }}" -maxdepth 1 -type f | sort

          echo "=> [Apps - Diagnostics] Финальный размер output:"
          du -sh "${{ env.OUTPUT_PATH }}"

      # Загрузка результатов
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apps-output
          path: output/
