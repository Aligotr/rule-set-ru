name: Build GeoSite
on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CONFIG_PATH: .github/geosite.yml
      DATA_PATH: community/data
      BUILD_DATA_PATH: build-data
      OUTPUT_PATH: output
      OUTPUT_TEXT_PATH: output/text
      STAGING_PATH: staging

    steps:
      - name: Checkout User Codebase
        uses: actions/checkout@v4

      - name: Checkout v2fly/domain-list-community
        uses: actions/checkout@v4
        with:
          repository: v2fly/domain-list-community
          path: community

      # Инициализация базовой среды
      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version-file: community/go.mod
          cache-dependency-path: community/go.sum

      - name: Setup YQ Environment
        run: |
          # Установка YAML-парсера для чтения конфигурации сборки
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Initialize Workspace
        run: |
          # Выделение базовых директорий для рабочего процесса
          mkdir -p \
            "${{ env.BUILD_DATA_PATH }}" \
            "${{ env.OUTPUT_PATH }}" \
            "${{ env.OUTPUT_TEXT_PATH }}" \
            "${{ env.STAGING_PATH }}"

      # Подготовка правил
      - name: Ingress External Data into V2Ray
        run: |
          set -euo pipefail

          # Загрузка внешних списков по конфигурации
          while read -r name; do
            url=$(yq -r ".externals.\"$name\".url" "${{ env.CONFIG_PATH }}")
            format=$(yq -r ".externals.\"$name\".format" "${{ env.CONFIG_PATH }}")

            echo "=> [External - Rules] Загрузка списка '$name'"

            case "$format" in
              plain)
                curl -fsSL "$url" > "${{ env.DATA_PATH }}/$name"
                ;;
              hosts_0.0.0.0)
                curl -fsSL "$url" | grep "0.0.0.0" | awk '{print $2}' > "${{ env.DATA_PATH }}/$name"
                ;;
              adguard_filter)
                curl -fsSL "$url" | \
                perl -ne '/^\|\|([-_0-9a-zA-Z]+(\.[-_0-9a-zA-Z]+){1,64})\^$/ && print "$1\n"' | \
                perl -ne 'print if not /^[0-9]{1,3}(\.[0-9]{1,3}){3}$/' | \
                grep -vi "t.co" > "${{ env.DATA_PATH }}/$name"
                ;;
              *)
                echo "=> Warning [External - Rules] Неизвестный формат '$format' для списка '$name'"
                exit 1
                ;;
            esac

            echo "=> [External - Rules] Список '$name' успешно сохранен"
          done < <(yq -r '.externals | keys[]' "${{ env.CONFIG_PATH }}")

      - name: Create custom-lists from EXTERNAL rule-lists
        run: |
          set -euo pipefail

          # Формирование пользовательских meta-списков по конфигурации
          while read -r list_name; do
            out="${{ env.DATA_PATH }}/$list_name"
            : > "$out"

            while read -r item; do
              [ -n "$item" ] || continue
              echo "include:$item" >> "$out"
            done < <(yq -r ".lists.\"$list_name\"[]" "${{ env.CONFIG_PATH }}")

            echo "=> [External - Rules] Список '$list_name' успешно сформирован"
          done < <(yq -r '.lists | keys[]' "${{ env.CONFIG_PATH }}")

      - name: Create custom-lists from LOCAL rule-lists
        run: |
          set -euo pipefail

          # Проверка наличия директории domains/ перед итерацией
          if [ -d "domains" ]; then

            declare -A ROUTE_MAP=()

            while read -r key; do
              ROUTE_MAP["$key"]="$(yq -r ".local_routing.\"$key\"" "${{ env.CONFIG_PATH }}")"
            done < <(yq -r '.local_routing | keys[]' "${{ env.CONFIG_PATH }}")

            # Извлечение всех ключей словаря для логирования
            # Замена пробелов на запятые для читабельного вывода
            ALL_KEYS=$(printf "%s\n" "${!ROUTE_MAP[@]}" | paste -sd ", " -)

            for file in domains/*.txt; do
              # Пропуск шага в случае отсутствия текстовых файлов
              [ -e "$file" ] || continue

              # Извлечение базового имени файла (например, "a-direct")
              fname=$(basename "$file" .txt)

              # Копирование файла в рабочую среду генератора V2Ray
              cp "$file" "${{ env.DATA_PATH }}/loc-$fname"

              matched=false

              # Эвристическое распределение (Назначение маршрута на основе ключевых слов в имени)
              # Итерация по всем ключам словаря для поиска совпадений в имени файла
              for key in "${!ROUTE_MAP[@]}"; do
                if [[ "$fname" == *"$key"* ]]; then
                  # Извлечение целевого списка из словаря
                  dest="${ROUTE_MAP[$key]}"

                  echo "include:loc-$fname" >> "${{ env.DATA_PATH }}/$dest"
                  echo "=> [Local - Rules] Файл '$fname' содержит ключ '$key', добавлен в список <$dest>"

                  matched=true
                  break # Остановка поиска при первом найденном совпадении
                fi
              done

              # Обработка файлов без совпадений
              if [ "$matched" = false ]; then
                echo "=> Warning [Local - Rules] Локальный файл $fname пропущен, в названии отсутствуют допустимые ключи маршрутизации: $ALL_KEYS"
              fi
            done
          fi

      - name: Resolve minimal V2Ray data-tree
        run: |
          set -euo pipefail

          # Очистка директории минимального дерева правил
          rm -rf "${{ env.BUILD_DATA_PATH }}"
          mkdir -p "${{ env.BUILD_DATA_PATH }}"

          # Инициализация словаря посещенных файлов
          declare -A VISITED=()

          resolve_file() {
            local name="$1"
            local file="${{ env.DATA_PATH }}/$name"

            if [ -n "${VISITED[$name]:-}" ]; then
              return 0
            fi

            if [ ! -f "$file" ]; then
              echo "=> Warning [Resolver] Файл '$name' не найден в исходной директории правил"
              return 0
            fi

            VISITED["$name"]=1
            cp "$file" "${{ env.BUILD_DATA_PATH }}/$name"
            echo "=> [Resolver] Файл '$name' добавлен в минимальное дерево"

            while read -r inc; do
              [ -n "$inc" ] || continue
              resolve_file "$inc"
            done < <(sed -n 's/^[[:space:]]*include:\([^[:space:]#@][^[:space:]#]*\).*/\1/p' "$file")
          }

          # Извлечение корневых тегов из publish-конфигурации
          while read -r root; do
            [ -n "$root" ] || continue
            resolve_file "$root"
          done < <(yq -r '.publish | keys[]' "${{ env.CONFIG_PATH }}")

          # Извлечение дополнительных тегов expose-конфигурации
          while read -r root; do
            [ -n "$root" ] || continue
            resolve_file "$root"
          done < <(yq -r '.expose[]?' "${{ env.CONFIG_PATH }}")

          # Подготовка списка экспорта для текстовых файлов
          EXPORT_LISTS=$(yq -r '.publish | keys | join(",")' "${{ env.CONFIG_PATH }}")
          echo "EXPORT_LISTS=$EXPORT_LISTS" >> "$GITHUB_ENV"

          # Подготовка списка тегов для DAT-профиля
          jq -n \
            --argjson publish "$(yq -o=json '.publish | keys' "${{ env.CONFIG_PATH }}")" \
            --argjson expose "$(yq -o=json '.expose' "${{ env.CONFIG_PATH }}")" \
            '
            ($publish + $expose | unique) as $targets
            | [
                {
                  output: "geosite.dat",
                  targets: $targets
                }
              ]
            ' > datprofile.json

          echo "=> [Resolver] Профиль сборки dat сформирован"

          # Логирование итогового набора включенных тегов
          printf '%s\n' "${!VISITED[@]}" | sort > resolved_rules.txt
          echo "=> [Resolver] Минимальное дерево правил сформировано"
          cat resolved_rules.txt

      - name: Build V2Ray geosite.dat
        run: |
          set -euo pipefail

          cd community
          go run ./ --datapath="../${{ env.BUILD_DATA_PATH }}" \
                    --outputdir="../${{ env.OUTPUT_PATH }}" \
                    --outputname="geosite.dat" \
                    --datprofile="../datprofile.json" \
                    --exportlists="${EXPORT_LISTS}"
          cd ..

          rm -f "${{ env.OUTPUT_PATH }}/gfwlist.txt"
          rm -f datprofile.json resolved_rules.txt
          echo "=> [DAT] Сборка geosite.dat завершена"

      - name: Prepare Staging Subsystem
        run: |
          set -euo pipefail

          # Выделение буферной директории для переименования исходников
          mkdir -p "${{ env.STAGING_PATH }}"

          # Копирование целевых текстовых файлов с применением финальных публичных имен конфигурации
          while IFS='=' read -r src_tag public_name; do
            src_file="${{ env.OUTPUT_PATH }}/${src_tag}.txt"
            [ -f "$src_file" ] || continue

            cp "$src_file" "${{ env.STAGING_PATH }}/${public_name}.txt"
            mv "$src_file" "${{ env.OUTPUT_TEXT_PATH }}/${public_name}.txt"

            echo "=> [Staging] Файл '$src_tag.txt' подготовлен как '${public_name}.txt'"
          done < <(yq -r '.publish | to_entries[] | "\(.key)=\(.value)"' "${{ env.CONFIG_PATH }}")

      # Сборка
      - name: Build Plain Text Lists (.txt)
        uses: ./.github/actions/converters/txt
        with:
          input_path: ${{ env.STAGING_PATH }}
          output_path: ${{ env.OUTPUT_PATH }}

      - name: Build Shadowrocket Rule-sets (_sr.list)
        uses: ./.github/actions/converters/shadowrocket
        with:
          input_path: ${{ env.STAGING_PATH }}
          output_path: ${{ env.OUTPUT_PATH }}

      - name: Build Mihomo Rule-sets (.mrs)
        uses: ./.github/actions/converters/mrs
        with:
          input_path: ${{ env.STAGING_PATH }}
          output_path: ${{ env.OUTPUT_PATH }}

      - name: Build Sing-box Rule-sets (.srs)
        uses: ./.github/actions/converters/srs
        with:
          input_path: ${{ env.STAGING_PATH }}
          output_path: ${{ env.OUTPUT_PATH }}

      # Загрузка результатов
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: geosite-output
          path: output/
