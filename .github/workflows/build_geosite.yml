name: Build GeoSite
on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CONFIG_PATH: .github/geosite.yml
      DATA_PATH: community/data
      RAW_BUILD_DATA_PATH: build-data-raw
      BUILD_DATA_PATH: build-data
      OUTPUT_PREFIX: geosite
      OUTPUT_PATH: output
      STAGING_PATH: staging

    steps:
      - name: Checkout User Codebase
        uses: actions/checkout@v4

      - name: Checkout v2fly/domain-list-community
        uses: actions/checkout@v4
        with:
          repository: v2fly/domain-list-community
          path: community

      # Инициализация базовой среды
      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version-file: community/go.mod
          cache-dependency-path: community/go.sum

      - name: Setup YQ Environment
        run: |
          # Установка YAML-парсера для чтения конфигурации сборки
          YQ_VERSION="v4.44.3"
          sudo wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq

      - name: Initialize Workspace
        run: |
          # Выделение базовых директорий для рабочего процесса
          mkdir -p \
            "${{ env.OUTPUT_PATH }}" \
            "${{ env.OUTPUT_TEXT_PATH }}" \
            "${{ env.STAGING_PATH }}"

      - name: Setup Shell Helpers
        run: |
          # Формирование файла общих хелперов для переиспользования между шагами
          COUNTRY_CODE=$(yq -r '.country_code' "${{ env.CONFIG_PATH }}")
          PREFIXED_LISTS=$(yq -r '.prefixed_lists[]?' "${{ env.CONFIG_PATH }}" | paste -sd '|' -)

          cat > /tmp/geosite-helpers.sh << EOF
          COUNTRY_CODE="${COUNTRY_CODE}"
          PREFIXED_LISTS="${PREFIXED_LISTS}"

          make_internal_name() {
            local name="\$1"
            if [[ -n "\${PREFIXED_LISTS}" && "|\${PREFIXED_LISTS}|" == *"|\${name}|"* ]]; then
              printf '%s-%s\n' "\${COUNTRY_CODE}" "\$name"
            else
              printf '%s\n' "\$name"
            fi
          }
          EOF

      # Подготовка правил
      - name: Ingress External Data into V2Ray
        run: |
          set -euo pipefail

          # Загрузка внешних списков по конфигурации
          while read -r name; do
            url=$(yq -r ".sources.\"$name\".url" "${{ env.CONFIG_PATH }}")
            format=$(yq -r ".sources.\"$name\".format" "${{ env.CONFIG_PATH }}")

            echo "=> [External - Rules] Загрузка списка '$name'"

            case "$format" in
              plain)
                curl -fsSL "$url" > "${{ env.DATA_PATH }}/$name"
                ;;
              hosts_0.0.0.0)
                curl -fsSL "$url" | grep "0.0.0.0" | awk '{print $2}' > "${{ env.DATA_PATH }}/$name"
                ;;
              adguard_filter)
                curl -fsSL "$url" | \
                perl -ne '/^\|\|([-_0-9a-zA-Z]+(\.[-_0-9a-zA-Z]+){1,64})\^$/ && print "$1\n"' | \
                perl -ne 'print if not /^[0-9]{1,3}(\.[0-9]{1,3}){3}$/' | \
                grep -vi "t.co" > "${{ env.DATA_PATH }}/$name"
                ;;
              *)
                echo "=> Warning [External - Rules] Неизвестный формат '$format' для списка '$name'" >&2
                exit 1
                ;;
            esac

            echo "=> [External - Rules] Список '$name' успешно сохранен"
          done < <(yq -r '.sources | keys[]' "${{ env.CONFIG_PATH }}")

      - name: Create custom-lists from CONFIG rule-lists
        run: |
          set -euo pipefail
          source /tmp/geosite-helpers.sh

          # Формирование пользовательских meta-списков по конфигурации
          while read -r logical_name; do
            [ -n "$logical_name" ] || continue

            internal_name=$(make_internal_name "$logical_name")
            out="${{ env.DATA_PATH }}/$internal_name"
            
            has_community=$(yq -r ".lists_community.\"$logical_name\"[]?" "${{ env.CONFIG_PATH }}" | grep -c . || true)
            has_local=$(yq -r ".lists_local.\"$logical_name\"[]?" "${{ env.CONFIG_PATH }}" | grep -c . || true)
            
            if [ "$has_community" -eq 0 ] && [ "$has_local" -eq 0 ]; then
              if [ -f "$out" ]; then
                echo "=> [Config - Rules] Список '$internal_name' уже существует, пропускаем"
              else
                echo "=> Warning [Config - Rules] Список '$internal_name' пуст и не найден в community/data" >&2
              fi
              continue
            fi
            
            : > "$out"

            while read -r item; do
              [ -n "$item" ] || continue
              include_name=$(make_internal_name "$item")
              echo "include:$include_name" >> "$out"
            done < <(yq -r ".lists_community.\"$logical_name\"[]?" "${{ env.CONFIG_PATH }}")

            while read -r item; do
              [ -n "$item" ] || continue

              if [ -f "domains/${item}.txt" ]; then
                cp "domains/${item}.txt" "${{ env.DATA_PATH }}/${item}"
                echo "include:${item}" >> "$out"
                echo "=> [Local - Rules] Файл '${item}.txt' добавлен в список <$internal_name>"
              else
                echo "=> Warning [Local - Rules] Локальный файл '${item}.txt' не найден" >&2
              fi
            done < <(yq -r ".lists_local.\"$logical_name\"[]?" "${{ env.CONFIG_PATH }}")

            echo "=> [Config - Rules] Список '$internal_name' успешно сформирован"
          done < <(yq -r '.publish | keys[]' "${{ env.CONFIG_PATH }}")

      - name: Resolve minimal V2Ray data-tree
        run: |
          set -euo pipefail
          source /tmp/geosite-helpers.sh

          # Очистка директории минимального дерева правил
          rm -rf "${{ env.RAW_BUILD_DATA_PATH }}" "${{ env.BUILD_DATA_PATH }}"
          mkdir -p "${{ env.RAW_BUILD_DATA_PATH }}" "${{ env.BUILD_DATA_PATH }}"

          flatten_file() {
            local name="$1"
            local stack="$2"
            local file="${{ env.DATA_PATH }}/$name"

            if [ ! -f "$file" ]; then
              echo "=> Warning [Resolver] Файл '$name' не найден в исходной директории правил" >&2
              return 0
            fi

            if [[ "|$stack|" == *"|$name|"* ]]; then
              echo "=> Warning [Resolver] Обнаружена циклическая зависимость в списке '$name'" >&2
              return 0
            fi

            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                include:*)
                  inc="${line#include:}"
                  inc="${inc%% *}"
                  [ -n "$inc" ] || continue
                  flatten_file "$inc" "$stack|$name"
                  ;;
                *)
                  printf '%s\n' "$line"
                  ;;
              esac
            done < "$file"
          }

          # Извлечение корневых тегов из publish-конфигурации
          while read -r root; do
            [ -n "$root" ] || continue
            internal_root=$(make_internal_name "$root")
            flatten_file "$internal_root" "" > "${{ env.RAW_BUILD_DATA_PATH }}/$internal_root"
            echo "=> [Resolver] Root-список '$internal_root' собран в raw-формате"
          done < <(yq -r '.publish | keys[]' "${{ env.CONFIG_PATH }}")

          # Извлечение дополнительных community-тегов
          while read -r root; do
            [ -n "$root" ] || continue
            internal_root=$(make_internal_name "$root")
            flatten_file "$internal_root" "" > "${{ env.RAW_BUILD_DATA_PATH }}/$internal_root"
            echo "=> [Resolver] Community-список '$internal_root' собран в raw-формате"
          done < <(yq -r '.lists_community_expose[]?' "${{ env.CONFIG_PATH }}")

          # Подготовка списка экспорта для текстовых файлов
          EXPORT_LISTS=$(while read -r root; do make_internal_name "$root"; done < <(yq -r '.publish | keys[]' "${{ env.CONFIG_PATH }}") | paste -sd "," -)
          echo "EXPORT_LISTS=$EXPORT_LISTS" >> "$GITHUB_ENV"

          echo "=> [Resolver] Минимальное дерево правил сформировано"

      - name: Normalize flattened rule-lists
        uses: ./.github/actions/normalize
        with:
          input_path: ${{ env.RAW_BUILD_DATA_PATH }}
          output_path: ${{ env.BUILD_DATA_PATH }}
          dedupe: "true"

      - name: Show Resolver Diagnostics
        run: |
          set -euo pipefail

          echo "=> [Diagnostics] Список файлов build-data"
          find "${{ env.BUILD_DATA_PATH }}" -maxdepth 1 -type f | sort

          echo "=> [Diagnostics] Количество файлов build-data: $(find "${{ env.BUILD_DATA_PATH }}" -maxdepth 1 -type f | wc -l)"
          echo "=> [Diagnostics] Размер build-data:"
          du -sh "${{ env.BUILD_DATA_PATH }}"

          echo "=> [Diagnostics] Список корневых тегов publish"
          yq -r '.publish | keys[]' "${{ env.CONFIG_PATH }}"

          echo "=> [Diagnostics] Список дополнительных community-тегов"
          yq -r '.lists_community_expose[]?' "${{ env.CONFIG_PATH }}" || true

          echo "=> [Diagnostics] Значение EXPORT_LISTS: ${EXPORT_LISTS}"

      - name: Build V2Ray geosite.dat
        run: |
          set -euo pipefail

          cd community
          go run ./ --datapath="../${{ env.BUILD_DATA_PATH }}" \
                    --outputdir="../${{ env.OUTPUT_PATH }}" \
                    --outputname="geosite.dat" \
                    --exportlists="${EXPORT_LISTS}"
          cd ..

          rm -f "${{ env.OUTPUT_PATH }}/gfwlist.txt"
          echo "=> [DAT] Сборка geosite.dat завершена"

      - name: Prepare Staging Subsystem
        run: |
          set -euo pipefail
          source /tmp/geosite-helpers.sh

          make_public_name() {
            local name="$1"
            printf '%s_%s\n' "${{ env.OUTPUT_PREFIX }}" "$name"
          }

          # Выделение буферной директории для переименования исходников
          mkdir -p "${{ env.STAGING_PATH }}"

          # Копирование целевых текстовых файлов с применением финальных публичных имен конфигурации
          while read -r entry; do
            src_tag="${entry%%=*}"
            public_name="${entry#*=}"
            internal_name=$(make_internal_name "$src_tag")
            output_name=$(make_public_name "$public_name")
            src_file="${{ env.OUTPUT_PATH }}/${internal_name}.txt"
            [ -f "$src_file" ] || continue

            mv "$src_file" "${{ env.STAGING_PATH }}/${output_name}.txt"

            echo "=> [Staging] Файл '${internal_name}.txt' подготовлен как '${output_name}.txt'"
          done < <(yq -r '.publish | to_entries[] | "\(.key)=\(.value)"' "${{ env.CONFIG_PATH }}")

      # Сборка
      - name: Build Shadowrocket Rule-sets (_sr.list)
        uses: ./.github/actions/geosite/shadowrocket
        with:
          input_path: ${{ env.STAGING_PATH }}
          output_path: ${{ env.OUTPUT_PATH }}

      - name: Build Mihomo Rule-sets (.mrs)
        uses: ./.github/actions/geosite/mrs
        with:
          input_path: ${{ env.STAGING_PATH }}
          output_path: ${{ env.OUTPUT_PATH }}

      - name: Build Sing-box Rule-sets (.srs)
        uses: ./.github/actions/geosite/srs
        with:
          input_path: ${{ env.STAGING_PATH }}
          output_path: ${{ env.OUTPUT_PATH }}

      - name: Show Final Diagnostics
        run: |
          set -euo pipefail

          echo "=> [Diagnostics] Финальное содержимое output"
          find "${{ env.OUTPUT_PATH }}" -maxdepth 1 -type f | sort

          echo "=> [Diagnostics] Финальный размер output:"
          du -sh "${{ env.OUTPUT_PATH }}"

      # Загрузка результатов
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: geosite-output
          path: output/
